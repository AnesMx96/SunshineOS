---
# Register the Sunshine tools with pacman (package sunshine-base from the signed [sunshine] repository, shipped on the ISO).
# Fixed: the shell loop lives in a script so Calamares does not try to substitute its own $p variable.
dontChroot: false
timeout: 120
ignoreErrors: true
i18n:
  name: "Registering the Sunshine tools"
script:
  - command: "/usr/local/bin/sunshine-register-base"
