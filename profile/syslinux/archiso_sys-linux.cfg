LABEL arch
TEXT HELP
Start the Sunshine OS live session (BIOS).
Try it without changing anything, or install it from the desktop.
ENDTEXT
MENU LABEL Sunshine OS: live session and installer
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% loglevel=6 cow_spacesize=4G vt.default_red=11,243,166,249,137,245,148,205,88,243,181,249,137,245,148,239 vt.default_grn=16,139,227,226,180,194,226,184,91,139,240,226,180,194,226,229 vt.default_blu=32,168,161,175,250,231,213,240,112,168,174,175,250,231,213,255

# Accessibility boot option
LABEL archspeech
TEXT HELP
Start Sunshine OS with a screen reader (BIOS).
Spoken feedback for the live session and installer.
ENDTEXT
MENU LABEL Sunshine OS with ^screen reader
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS% loglevel=6 cow_spacesize=4G vt.default_red=11,243,166,249,137,245,148,205,88,243,181,249,137,245,148,239 vt.default_grn=16,139,227,226,180,194,226,184,91,139,240,226,180,194,226,229 vt.default_blu=32,168,161,175,250,231,213,240,112,168,174,175,250,231,213,255

# Safe graphics: no kernel mode setting (black screen, old or unusual GPUs)
LABEL archsafe
TEXT HELP
Boot the live session without kernel mode setting: for black screens and old or unusual graphics cards.
ENDTEXT
MENU LABEL Sunshine OS: safe graphics (nomodeset)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% loglevel=6 cow_spacesize=4G nomodeset module_blacklist=pcspkr
