title    Sunshine OS safe graphics (nomodeset, UEFI)
sort-key 01c
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% cow_spacesize=4G nomodeset module_blacklist=pcspkr
