# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Graphics-mode menu with the Sunshine theme, but ONLY when the theme can really be read from the ISO.
#  - The theme is looked up on the ISO ($root), not in ${prefix}: under UEFI ${prefix} is GRUB's built-in memory disk (no theme there:
#    "file /boot/grub/themes/sunshine/theme.txt not found"), and under Ventoy's GRUB2 mode it is Ventoy's own folder.
#  - Graphics mode without a usable theme crashes Ventoy's GRUB2 mode ("unaligned pointer 0x... Aborted", tested), so if the theme is not
#    reachable the menu stays in plain text, which works everywhere.
if [ -f ($root)/boot/grub/themes/sunshine/theme.txt ] && loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
    insmod png
    insmod gfxmenu
    set theme=($root)/boot/grub/themes/sunshine/theme.txt
    export theme
fi

# No serial console on purpose: on many real machines there is no "com0", and "serial --unit=0" ends with
# "error: serial port 'com0' isn't found. unaligned pointer ... Aborted." before the menu is shown (UEFI laptops).

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Get the lowercase UEFI machine type short-name to use for architecture-specific tools
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    elif [ "${grub_cpu}" == 'arm64' ]; then
        uefi_machine_type_lower='aa64'
    elif [ "${grub_cpu}" == 'riscv64' ]; then
        uefi_machine_type_lower='riscv64'
    elif [ "${grub_cpu}" == 'loongarch64' ]; then
        uefi_machine_type_lower='loongarch64'
    fi
fi

# Set default menu entry
default=archlinux
timeout=8
timeout_style=menu


# Menu entries

menuentry "Sunshine OS: live session and installer (${archiso_platform})" --class sunshineos --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% cow_spacesize=4G vt.default_red=11,243,166,249,137,245,148,205,88,243,181,249,137,245,148,239 vt.default_grn=16,139,227,226,180,194,226,184,91,139,240,226,180,194,226,229 vt.default_blu=32,168,161,175,250,231,213,240,112,168,174,175,250,231,213,255
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Sunshine OS: safe graphics (nomodeset, for black screens and old or unusual GPUs)" --class sunshineos --class arch --class gnu-linux --class gnu --class os --id 'archlinux-nomodeset' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% cow_spacesize=4G nomodeset module_blacklist=pcspkr
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Sunshine OS: live session with persistent changes (development)" --class sunshineos --class arch --class gnu-linux --class gnu --class os --id 'archlinux-persistent' {
    # For developing the image: every change made in the live session is kept on a disk labelled "sunpersist" (an ext4 file system) instead of
    # RAM, so it survives reboots and can be harvested back into the sources (test/dev-vm.sh). Without such a disk this behaves like the normal entry.
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% cow_label=sunpersist cow_persistent=P vt.default_red=11,243,166,249,137,245,148,205,88,243,181,249,137,245,148,239 vt.default_grn=16,139,227,226,180,194,226,184,91,139,240,226,180,194,226,229 vt.default_blu=32,168,161,175,250,231,213,240,112,168,174,175,250,231,213,255
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Sunshine OS with screen reader (${archiso_platform})" --hotkey s --class sunshineos --class arch --class gnu-linux --class gnu --class os --id 'archlinux-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS% cow_spacesize=4G vt.default_red=11,243,166,249,137,245,148,205,88,243,181,249,137,245,148,239 vt.default_grn=16,139,227,226,180,194,226,184,91,139,240,226,180,194,226,229 vt.default_blu=32,168,161,175,250,231,213,240,112,168,174,175,250,231,213,255
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' -a -f "/boot/memtest86+/memtest86${uefi_machine_type_lower}.efi" ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest86${uefi_machine_type_lower}.efi
    }
elif [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    if [ -f "/shell${uefi_machine_type_lower}.efi" ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shell${uefi_machine_type_lower}.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}


# GRUB init tune for accessibility
play 600 988 1 1319 4
