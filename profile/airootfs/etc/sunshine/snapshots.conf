# Restore points. btrfs systems use Snapper (snapshots, bootable from GRUB); every other file system uses Timeshift (rsync copies of the system).
# Edit and save; no restart needed.
PRE_UPDATE=yes        # make a restore point before every system update (Timeshift systems; Snapper systems use snap-pac)
KEEP_PRE=3            # how many "before update" restore points Timeshift keeps
