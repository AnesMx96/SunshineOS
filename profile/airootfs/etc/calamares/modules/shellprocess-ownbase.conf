---
# Register the Sunshine tools with pacman (package sunshine-base from the signed [sunshine] repository, shipped on the ISO): the files are
# already in the new system, so this only takes ownership and later updates come through normal pacman updates. Offline-safe.
# The loop is in a script on purpose: Calamares would substitute its own variable for every $name written in this file.
dontChroot: false
timeout: 120
ignoreErrors: true
i18n:
  name: "Registering the Sunshine tools"
script:
  - command: "/usr/local/bin/sunshine-register-base"
