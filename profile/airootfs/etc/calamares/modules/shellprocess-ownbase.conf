---
# Register the Sunshine tools with pacman (package sunshine-base from the signed [sunshine] repository, shipped on the ISO): the files are
# already in the new system, so this only takes ownership (--overwrite) and later updates come through normal pacman updates. Offline-safe.
dontChroot: false
timeout: 120
ignoreErrors: true
i18n:
  name: "Registering the Sunshine tools"
script:
  - command: "for p in /usr/share/sunshine/pkgs/sunshine-base-*.pkg.tar.zst; do [ -f \"$p\" ] && pacman -U --noconfirm --overwrite '*' \"$p\"; done; true"
