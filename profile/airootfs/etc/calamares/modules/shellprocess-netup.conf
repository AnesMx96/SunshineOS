---
# The chosen apps are installed inside the new system, which needs DNS: borrow the live system's resolver for the duration
dontChroot: true
timeout: 60
i18n:
  name: "Preparing the network for the chosen apps"
script:
  - command: "[ -e ${ROOT}/etc/resolv.conf -o -L ${ROOT}/etc/resolv.conf ] && mv -f ${ROOT}/etc/resolv.conf ${ROOT}/etc/resolv.conf.sunshine-apps; cp -L /etc/resolv.conf ${ROOT}/etc/resolv.conf || echo 'nameserver 1.1.1.1' > ${ROOT}/etc/resolv.conf; true"
