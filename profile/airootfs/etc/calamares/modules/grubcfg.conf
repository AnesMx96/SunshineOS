---
overwrite: false
defaults:
  GRUB_DISABLE_OS_PROBER: false      # other systems on the disk (Windows, other Linux) get a boot menu entry
  GRUB_TIMEOUT: 5
  GRUB_DEFAULT: "saved"
  GRUB_DISABLE_SUBMENU: true
  GRUB_TERMINAL_OUTPUT: "console"
  GRUB_DISABLE_RECOVERY: true
  GRUB_DISTRIBUTOR: "Sunshine OS"
prefer_grub_d: false
kernel_params: [ "loglevel=6", "vt.default_red=11,243,166,249,137,245,148,205,88,243,181,249,137,245,148,239", "vt.default_grn=16,139,227,226,180,194,226,184,91,139,240,226,180,194,226,229", "vt.default_blu=32,168,161,175,250,231,213,240,112,168,174,175,250,231,213,255" ]   # the last three: pastel console colours for the boot log
always_use_defaults: false
