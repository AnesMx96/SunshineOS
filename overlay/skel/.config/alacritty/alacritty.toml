# Sunshine OS terminal theme: the distribution palette (indigo background #0e1422, cream text #efe5d0, accent #ff9654), 20% transparent background.
[window]
opacity = 0.8
blur = true
padding = { x = 12, y = 12 }

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 11.0

[cursor]
style = { shape = "Beam", blinking = "Off" }

[colors.primary]
background = "#0e1422"
foreground = "#efe5d0"

[colors.cursor]
cursor = "#ff9654"
text = "#0e1422"

[colors.selection]
background = "#262f47"
text = "#efe5d0"

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
